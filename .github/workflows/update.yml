name: 更新資料並部署

on:
  schedule:
    # 每小時的第 23 分執行。GitHub 的排程在尖峰時段（尤其整點附近）常延遲或被略過，
    # 所以排得比需要的密一點，並避開整點，確保資料不會落後超過幾小時。
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: 抓取最新資料
        id: fetch
        continue-on-error: true
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
        run: python build_data.py data.new.json

      - name: 成功：存到 data 分支（覆蓋舊版，不累積歷史）
        if: steps.fetch.outcome == 'success'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv data.new.json data.json
          mkdir -p /tmp/databranch && cp data.json /tmp/databranch/
          cd /tmp/databranch
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -q -m "資料 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - name: 有新幣需要到派網 App 確認現貨時，開 GitHub 待辦通知
        if: steps.fetch.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const d = JSON.parse(fs.readFileSync("data.json", "utf8"));
            const list = d.unconfirmed || [], lost = d.manualLost || [];
            const { owner, repo } = context.repo;
            const label = "待確認現貨";
            const open = (await github.rest.issues.listForRepo({ owner, repo, state: "open", labels: label })).data;
            if (!list.length && !lost.length) {
              for (const i of open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: "名單都確認完了，自動關閉。" });
                await github.rest.issues.update({ owner, repo, issue_number: i.number, state: "closed" });
              }
              return;
            }
            const fileUrl = `https://github.com/${owner}/${repo}/edit/main/spot_manual.txt`;
            const parts = [];
            if (list.length) parts.push("確認現貨：" + list.join("、"));
            if (lost.length) parts.push("合約已下架：" + lost.join("、"));
            const title = "派網現貨名單需要更新（" + parts.join("；") + "）";
            const body = [`@${owner} 請到派網 App 確認以下幣種，然後打開 [spot_manual.txt](${fileUrl}) 修改，按右上角 Commit changes 存檔。`, ""];
            if (list.length) body.push(
              "### 新幣：有合約，但派網公開資料沒有現貨",
              "網站目前先當作只有合約。請在 App 查能不能開**現貨網格**：能開的加到 `[可開現貨]`，不能開的加到 `[不能開現貨]`。", "",
              ...list.map(s => `- [ ] ${s}`), "");
            if (lost.length) body.push(
              "### 人工名單上的幣，合約已經下架",
              "這些幣的現貨是借用合約 K 線計算的，合約下架後網站拿不到資料，已暫時從網站移除。請在 App 查現貨還在不在：已經下架的，從 `[可開現貨]` 移到 `[不能開現貨]`；現貨還在的，維持不動（網站暫時無法顯示）。", "",
              ...lost.map(s => `- [ ] ${s}`), "");
            body.push("存檔後網站會自動重新抓資料並部署，名單都處理完，這則待辦會自動關閉。");
            const text = body.join("\n");
            if (open.length) {
              const i = open[0];
              if (i.title !== title) {
                await github.rest.issues.update({ owner, repo, issue_number: i.number, title, body: text });
                await github.rest.issues.createComment({ owner, repo, issue_number: i.number, body: `@${owner} 待辦內容更新：${parts.join("；")}` });
              }
              return;
            }
            try { await github.rest.issues.createLabel({ owner, repo, name: label, color: "E0A650" }); } catch (e) {}
            await github.rest.issues.create({ owner, repo, title, body: text, labels: [label] });

      - name: 失敗：沿用上一次成功的資料
        if: steps.fetch.outcome != 'success'
        run: |
          echo "::warning::這次抓取資料失敗，網頁沿用上一次成功的資料"
          git fetch -q --depth 1 origin data && git show origin/data:data.json > data.json || echo "沒有 data 分支，使用 repository 內附的初始資料"

      - name: 產生網頁（抓取失敗時沿用上一次的資料）
        run: |
          mkdir -p site
          python build_html.py data.json site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site


  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
